spring.application.name=NewCampoLibre
# Application Name

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/new_campolibre?createDatabaseIfNotExist=true

spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true


# Hikari (timeouts razonables)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=10

# Configuración de archivos subidos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Ruta de uploads (carpeta en la raíz del proyecto)
upload.path=uploads/

# Configuración de Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server Configuration
server.port=8080 

# ===================================================
# ? CONFIGURACI?N DE CORREO ELECTR?NICO (GMAIL SMTP)
# ===================================================
# Servidor SMTP de Google
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Tu direcci?n de correo completa de Gmail
spring.mail.username=librecampo1@gmail.com 

# La contrase?a se toma de la variable de entorno MAIL_PASSWORD (no la dejes en el repo).
# Si quieres un valor por defecto (no recomendado), puedes usar: ${MAIL_PASSWORD:tu_valor}
spring.mail.password=vkdx kcbg andj hnnk

# Remitente configurable (por defecto se usa spring.mail.username)
mail.from=${spring.mail.username:eventos@campolibre.com}

# Habilitar autenticaci?n y STARTTLS (requerido por Gmail)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Habilitar debug de JavaMail para ver la conversación SMTP en logs durante pruebas
spring.mail.properties.mail.debug=true

# Propiedades adicionales recomendadas para Gmail/SMTP
# Permite confiar en el certificado de Gmail y evitar errores SSL
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
# Timeouts razonables para evitar bloqueos largos
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Fuerza a Spring Boot a comprobar la conexión SMTP al arrancar (útil para detectar problemas de configuración)
spring.mail.test-connection=true

# IMPORTANTE: Configura la contraseña en la variable de entorno MAIL_PASSWORD o directamente
# en spring.mail.password (no recomendado en repositorios). Si usas Gmail, crea una "App Password"
# desde tu cuenta Google y usa ese valor aquí.
# En Windows (PowerShell): setx MAIL_PASSWORD "tu_app_password"
# Luego reinicia tu IDE/sistema para que la variable de entorno esté disponible.