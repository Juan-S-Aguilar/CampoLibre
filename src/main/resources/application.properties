spring.application.name=NewCampoLibre
# Application Name

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3307/new_campolibre?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Configuración de archivos subidos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Ruta de uploads (carpeta en la raíz del proyecto)
upload.path=uploads/

# Configuración de Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server Configuration
server.port=8080 

# ===================================================
# ? CONFIGURACIÓN DE CORREO ELECTRÓNICO (SPRING MAIL)
# ===================================================
# Configuración para usar MailHog en desarrollo local
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
# Deshabilitamos la autenticación y TLS/SSL para conexiones locales con MailHog
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false