<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="form_content(patrocinador)">

    <!-- Header del formulario -->
    <div class="form-header">
        <h2>
            <i class="bi bi-handshake-fill"></i>
            <span th:if="${patrocinador.id_patrocinador}" th:text="'Editar Patrocinador: ' + ${patrocinador.nombre}">Editar Patrocinador</span>
            <span th:unless="${patrocinador.id_patrocinador}">Crear Nuevo Patrocinador</span>
        </h2>
        <p>Gestione la información detallada del patrocinador.</p>
    </div>

    <!-- Mensajes -->
    <div th:if="${error}" class="alert alert-danger" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
    </div>

    <!-- Formulario -->

            <form
                    th:action="${patrocinador.id_patrocinador != null}
                        ? @{/admin/patrocinadores/actualizar/{id}(id=${patrocinador.id_patrocinador})}
                        : @{/admin/patrocinadores/crear}"
                    th:object="${patrocinador}"
                    method="post"
                    class="needs-validation"
                    novalidate
            >
                <input type="hidden" th:field="*{id_patrocinador}" />

                <h5 class="mb-3 text-primary"><i class="bi bi-info-circle me-2"></i> Información General</h5>

                <div class="mb-3">
                    <label for="nombre" class="form-label fw-bold">Nombre de la Empresa / Marca *</label>
                    <input type="text" th:field="*{nombre}" class="form-control" id="nombre" required
                           placeholder="Ej: Agro S.A.S." maxlength="100">
                    <div class="invalid-feedback">Ingrese el nombre del patrocinador.</div>
                </div>

                <div class="mb-3">
                    <label for="descripcion" class="form-label fw-bold">Descripción *</label>
                    <textarea th:field="*{descripcion}" class="form-control" id="descripcion" rows="3" required
                              placeholder="Breve descripción de la actividad y rubro del patrocinador." maxlength="255"></textarea>
                    <div class="invalid-feedback">La descripción es obligatoria.</div>
                </div>

                <div class="mb-3">
                    <label for="logoUrl" class="form-label">URL del Logo (Opcional)</label>
                    <input type="url" th:field="*{logoUrl}" class="form-control" id="logoUrl"
                           placeholder="Ej: https://misitio.com/logo.png">
                    <div class="form-text">Debe ser una URL válida que apunte a la imagen del logo.</div>
                </div>

                <hr class="mt-4 mb-4">

                <h5 class="mb-3 text-primary"><i class="bi bi-person-lines-fill me-2"></i> Contacto</h5>

                <div class="mb-3">
                    <label for="personaContacto" class="form-label">Persona de Contacto (Opcional)</label>
                    <input type="text" th:field="*{personaContacto}" class="form-control" id="personaContacto"
                           placeholder="Ej: Juan Pérez" maxlength="100">
                </div>

                <div class="mb-3">
                    <label for="contactoEmail" class="form-label fw-bold">Email de Contacto *</label>
                    <input type="email" th:field="*{contactoEmail}" class="form-control" id="contactoEmail" required
                           placeholder="ejemplo@contacto.com" maxlength="100">
                    <div class="invalid-feedback">Ingrese un email de contacto válido.</div>
                </div>

                <div class="mb-3">
                    <label for="telefonoContacto" class="form-label">Teléfono de Contacto (Opcional)</label>
                    <input type="tel" th:field="*{telefonoContacto}" class="form-control" id="telefonoContacto"
                           placeholder="Ej: +57 300 1234567" maxlength="20">
                </div>

                <div class="mb-3">
                    <label for="sitioWeb" class="form-label">Sitio Web (Opcional)</label>
                    <input type="url" th:field="*{sitioWeb}" class="form-control" id="sitioWeb"
                           placeholder="Ej: https://www.misitio.com" maxlength="100">
                </div>

                <div th:if="${patrocinador.id_patrocinador}" class="mb-3">
                    <label class="form-label fw-bold">Estado</label>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="activo" th:field="*{activo}">
                        <label class="form-check-label" for="activo">
                            <span th:text="${patrocinador.activo} ? 'Patrocinador Activo' : 'Patrocinador Inactivo (Archivado)'">Activo</span>
                        </label>
                    </div>
                </div>

                <div class="d-flex justify-content-end mt-5">
                    <a th:href="@{/admin/patrocinadores}" class="btn btn-secondary me-2">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i th:if="${patrocinador.id_patrocinador}" class="bi bi-save"></i>
                        <i th:unless="${patrocinador.id_patrocinador}" class="bi bi-plus-circle"></i>
                        <span th:text="${patrocinador.id_patrocinador != null ? 'Guardar Cambios' : 'Crear Patrocinador'}">Guardar</span>
                    </button>
                </div>

            </form>
</div>

<script>
    // Validación de Bootstrap 5
    (function () {
      'use strict'
      var forms = document.querySelectorAll('.needs-validation')
      Array.prototype.slice.call(forms)
        .forEach(function (form) {
          form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
              event.preventDefault()
              event.stopPropagation()
            }
            form.classList.add('was-validated')
          }, false)
        })
    })()
</script>

</body>
</html>
