<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="form_content(patrocinador)" class="row justify-content-center">
    <div class="col-lg-8 col-md-10">

        <div class="mb-4 p-3 bg-white rounded shadow-sm border-start border-success border-5">
            <h1 class="h4 mb-0 text-success">
                <i class="bi bi-handshake-fill me-2"></i>
                <span th:if="${patrocinador.id_patrocinador}" th:text="'Editar Patrocinador: ' + ${patrocinador.nombre}">Editar Patrocinador</span>
                <span th:unless="${patrocinador.id_patrocinador}">Crear Nuevo Patrocinador</span>
            </h1>
            <p class="text-muted mb-0 mt-1">
                Gestione la información detallada del patrocinador.
            </p>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card shadow border-0 p-4">

            <form
                    th:action="${patrocinador.id_patrocinador}
                        ? @{/admin/patrocinadores/actualizar/{id}(id=${patrocinador.id_patrocinador})}
                        : @{/admin/patrocinadores/crear}"
                    th:object="${patrocinador}"
                    method="post"
                    class="needs-validation"
                    novalidate
            >
                <input type="hidden" th:field="*{id_patrocinador}" />

                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre de la Empresa / Marca</label>
                    <input type="text" th:field="*{nombre}" class="form-control" id="nombre" required
                           placeholder="Ej: Agro S.A.S." maxlength="100">
                    <div class="invalid-feedback">
                        Ingrese el nombre del patrocinador.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="personaContacto" class="form-label">Persona de Contacto</label>
                    <input type="text" th:field="*{personaContacto}" class="form-control" id="personaContacto" required
                           placeholder="Ej: Juan Pérez" maxlength="100">
                    <div class="invalid-feedback">
                        Ingrese el nombre de la persona de contacto.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email de Contacto</label>
                    <input type="email" th:field="*{email}" class="form-control" id="email" required
                           placeholder="ejemplo@contacto.com" maxlength="100">
                    <div class="invalid-feedback">
                        Ingrese un email válido.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono de Contacto</label>
                    <input type="tel" th:field="*{telefono}" class="form-control" id="telefono"
                           placeholder="Ej: +57 300 1234567" maxlength="20">
                    <div class="form-text">Opcional.</div>
                </div>

                <div class="d-flex justify-content-end mt-4">
                    <a th:href="@{/admin/patrocinadores}" class="btn btn-secondary me-2">
                        <i class="bi bi-x-circle"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-success">
                        <i th:if="${patrocinador.id_patrocinador}" class="bi bi-save"></i>
                        <i th:unless="${patrocinador.id_patrocinador}" class="bi bi-plus-circle"></i>
                        <span th:text="${patrocinador.id_patrocinador} ? 'Guardar Cambios' : 'Crear Patrocinador'">Guardar</span>
                    </button>
                </div>

            </form>
        </div>

    </div>
</div>

</body>
</html>
