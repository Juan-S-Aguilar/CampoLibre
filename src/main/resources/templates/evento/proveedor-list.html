<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Catálogo de Eventos - Campo Libre</title>
</head>
<body>

<main th:fragment="content">
    <div class="list-container">

        <!-- Header de la lista -->
        <div class="list-header">
            <h2>
                <i class="bi bi-calendar-week"></i>
                Catálogo de Eventos
            </h2>
        </div>

        <!-- Filtros con tarjetas de estado -->
        <div class="stats-grid">
            <div class="stat-card stat-card-clickable filter-card active" data-estado="TODOS">
                <div class="stat-icon bg-primary">
                    <i class="bi bi-grid-fill"></i>
                </div>
                <div class="stat-value" th:text="${eventos.size()}">0</div>
                <div class="stat-label">Todos</div>
            </div>

            <div class="stat-card stat-card-clickable filter-card" data-estado="PUBLICADO">
                <div class="stat-icon bg-success">
                    <i class="bi bi-broadcast"></i>
                </div>
                <div class="stat-value" th:text="${#lists.size(eventos.?[estado == T(com.example.campolibre.Enum.EstadoEvento).PUBLICADO])}">0</div>
                <div class="stat-label">Publicados</div>
            </div>

            <div class="stat-card stat-card-clickable filter-card" data-estado="EN_CURSO">
                <div class="stat-icon bg-info">
                    <i class="bi bi-play-circle-fill"></i>
                </div>
                <div class="stat-value" th:text="${#lists.size(eventos.?[estado == T(com.example.campolibre.Enum.EstadoEvento).EN_CURSO])}">0</div>
                <div class="stat-label">En Curso</div>
            </div>

            <div class="stat-card stat-card-clickable filter-card" data-estado="FINALIZADO">
                <div class="stat-icon bg-secondary">
                    <i class="bi bi-flag-fill"></i>
                </div>
                <div class="stat-value" th:text="${#lists.size(eventos.?[estado == T(com.example.campolibre.Enum.EstadoEvento).FINALIZADO])}">0</div>
                <div class="stat-label">Finalizados</div>
            </div>

            <div class="stat-card stat-card-clickable filter-card" data-estado="CANCELADO">
                <div class="stat-icon bg-danger">
                    <i class="bi bi-x-circle-fill"></i>
                </div>
                <div class="stat-value" th:text="${#lists.size(eventos.?[estado == T(com.example.campolibre.Enum.EstadoEvento).CANCELADO])}">0</div>
                <div class="stat-label">Cancelados</div>
            </div>
        </div>

        <!-- Búsqueda -->
        <div class="list-filters">
            <div class="search-box">
                <input type="text"
                       id="buscadorAdmin"
                       placeholder="Buscar evento..."
                       onkeyup="buscarEnTabla()">
                <i class="bi bi-search"></i>
            </div>
        </div>

        <!-- Tabla de Eventos -->
        <div class="table-responsive">
            <table class="data-table" id="tablaEventos">
                <thead>
                <tr>
                    <th>Evento</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                    <th>Cupos Disp.</th>
                    <th>Precio</th>
                    <th style="text-align: center;">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="evento : ${eventos}"
                    class="evento-row"
                    th:attr="data-estado=${evento.estado.name()}">

                    <td data-label="Evento">
                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <div style="width: 50px; height: 50px; border-radius: 8px; overflow: hidden; background-color: var(--color-bg-light); display: flex; align-items: center; justify-content: center; border: 2px solid var(--border-color);">
                                <img th:if="${evento.imagen_evento != null}"
                                     th:src="@{'/uploads/' + ${evento.imagen_evento}}"
                                     style="width: 100%; height: 100%; object-fit: cover;"
                                     alt="Evento">
                                <i th:unless="${evento.imagen_evento != null}"
                                   class="bi bi-image"
                                   style="font-size: 1.5rem; color: var(--color-primary);"></i>
                            </div>
                            <div>
                                <strong th:text="${evento.nombre}">Nombre</strong>
                                <br>
                                <small style="color: var(--color-text-light);" th:text="${evento.tipo_evento}">TIPO</small>
                            </div>
                        </div>
                    </td>

                    <td data-label="Fecha">
                        <span th:text="${#temporals.format(evento.fecha_evento, 'dd/MM/yyyy')}">Fecha</span>
                        <br>
                        <small style="color: var(--color-text-light);" th:text="${#temporals.format(evento.hora_evento, 'HH:mm')}">Hora</small>
                    </td>

                    <td data-label="Estado">
                        <span class="status-badge"
                              th:classappend="${evento.estado.name() == 'PUBLICADO'} ? 'approved' :
                                              (${evento.estado.name() == 'EN_CURSO'} ? 'active' :
                                              (${evento.estado.name() == 'FINALIZADO'} ? 'inactive' : 'rejected'))"
                              th:text="${evento.estado.name()}">
                            ESTADO
                        </span>
                    </td>

                    <td data-label="Cupos">
                        <i class="bi bi-person"></i>
                        <span th:text="${evento.cuposDisponibles}">0</span> libres
                    </td>

                    <td data-label="Precio">
                        $<span th:text="${#numbers.formatDecimal(evento.costoEspacio, 0, 'COMMA', 0, 'POINT')}">0</span>
                    </td>

                    <td data-label="Acciones">
                        <div class="table-actions">
                            <a th:href="@{/eventos/ver/{id}(id=${evento.id_evento})}"
                               class="btn-action btn-view"
                               title="Ver Detalles e Inscribirse">
                                <i class="bi bi-eye"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script>
        // Filtrar por estado usando data-attributes
        document.addEventListener('DOMContentLoaded', function() {
            // Click en tarjetas de filtro
            const filterCards = document.querySelectorAll('.filter-card');
            filterCards.forEach(function(card) {
                card.addEventListener('click', function() {
                    const estado = this.getAttribute('data-estado');

                    // Actualizar clase active
                    filterCards.forEach(function(c) {
                        c.classList.remove('active');
                    });
                    this.classList.add('active');

                    // Filtrar filas
                    const rows = document.querySelectorAll('.evento-row');
                    rows.forEach(function(row) {
                        const rowEstado = row.getAttribute('data-estado');
                        if (estado === 'TODOS' || rowEstado === estado) {
                            row.style.display = '';
                        } else {
                            row.style.display = 'none';
                        }
                    });
                });
            });
        });

        // Buscar en la tabla
        window.buscarEnTabla = function() {
            const searchValue = document.getElementById('buscadorAdmin').value.toLowerCase();
            const rows = document.querySelectorAll('.evento-row');

            rows.forEach(function(row) {
                const text = row.textContent.toLowerCase();
                row.style.display = text.indexOf(searchValue) > -1 ? '' : 'none';
            });
        };
    </script>
</main>

</body>
</html>
