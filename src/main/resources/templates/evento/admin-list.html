<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Gestión de Eventos - Campo Libre</title>
</head>
<body>

<main th:fragment="content">
    <div class="list-container">

        <!-- Header de la lista -->
        <div class="list-header">
            <h2>
                <i class="bi bi-gear-wide-connected"></i>
                Gestión de Eventos
            </h2>
            <div class="list-header-actions">
                <a th:href="@{/eventos/crear}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Nuevo Evento
                </a>
            </div>
        </div>

        <div class="row mb-4 g-3">
            <div class="col-md-2 col-6">
                <div class="card bg-light border-0 shadow-sm h-100 filter-card active"
                     onclick="filtrarTabla('TODOS', this)">
                    <div class="card-body text-center p-3">
                        <div class="bg-primary text-white rounded-circle p-2 d-inline-block mb-2">
                            <i class="bi bi-grid-fill fs-5"></i>
                        </div>
                        <h4 class="mb-0 fw-bold" th:text="${eventos.size()}">0</h4>
                        <small class="text-muted">Todos</small>
                    </div>
                </div>
            </div>

            <div class="col-md-2 col-6">
                <div class="card bg-light border-0 shadow-sm h-100 filter-card"
                     onclick="filtrarTabla('PUBLICADO', this)">
                    <div class="card-body text-center p-3">
                        <div class="bg-success text-white rounded-circle p-2 d-inline-block mb-2">
                            <i class="bi bi-broadcast fs-5"></i>
                        </div>
                        <h4 class="mb-0 fw-bold" th:text="${#lists.size(eventos.?[estado == T(com.example.campolibre.Enum.EstadoEvento).PUBLICADO])}">0</h4>
                        <small class="text-muted">Publicados</small>
                    </div>
                </div>
            </div>

            <div class="col-md-2 col-6">
                <div class="card bg-light border-0 shadow-sm h-100 filter-card"
                     onclick="filtrarTabla('EN_CURSO', this)">
                    <div class="card-body text-center p-3">
                        <div class="bg-info text-white rounded-circle p-2 d-inline-block mb-2">
                            <i class="bi bi-play-circle-fill fs-5"></i>
                        </div>
                        <h4 class="mb-0 fw-bold" th:text="${#lists.size(eventos.?[estado == T(com.example.campolibre.Enum.EstadoEvento).EN_CURSO])}">0</h4>
                        <small class="text-muted">En Curso</small>
                    </div>
                </div>
            </div>

            <div class="col-md-2 col-6">
                <div class="card bg-light border-0 shadow-sm h-100 filter-card"
                     onclick="filtrarTabla('BORRADOR', this)">
                    <div class="card-body text-center p-3">
                        <div class="bg-warning text-dark rounded-circle p-2 d-inline-block mb-2">
                            <i class="bi bi-pencil-square fs-5"></i>
                        </div>
                        <h4 class="mb-0 fw-bold" th:text="${#lists.size(eventos.?[estado == T(com.example.campolibre.Enum.EstadoEvento).BORRADOR])}">0</h4>
                        <small class="text-muted">Borradores</small>
                    </div>
                </div>
            </div>

            <div class="col-md-2 col-6">
                <div class="card bg-light border-0 shadow-sm h-100 filter-card"
                     onclick="filtrarTabla('FINALIZADO', this)">
                    <div class="card-body text-center p-3">
                        <div class="bg-secondary text-white rounded-circle p-2 d-inline-block mb-2">
                            <i class="bi bi-flag-fill fs-5"></i>
                        </div>
                        <h4 class="mb-0 fw-bold" th:text="${#lists.size(eventos.?[estado == T(com.example.campolibre.Enum.EstadoEvento).FINALIZADO])}">0</h4>
                        <small class="text-muted">Finalizados</small>
                    </div>
                </div>
            </div>

            <div class="col-md-2 col-6">
                <div class="card bg-light border-0 shadow-sm h-100 filter-card"
                     onclick="filtrarTabla('CANCELADO', this)">
                    <div class="card-body text-center p-3">
                        <div class="bg-danger text-white rounded-circle p-2 d-inline-block mb-2">
                            <i class="bi bi-x-circle-fill fs-5"></i>
                        </div>
                        <h4 class="mb-0 fw-bold" th:text="${#lists.size(eventos.?[estado == T(com.example.campolibre.Enum.EstadoEvento).CANCELADO])}">0</h4>
                        <small class="text-muted">Cancelados</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- Búsqueda -->
        <div class="list-filters">
            <div class="search-box">
                <input type="text"
                       id="buscadorAdmin"
                       placeholder="Buscar evento..."
                       onkeyup="buscarEnTabla()">
                <i class="bi bi-search"></i>
            </div>
        </div>

        <!-- Contador de resultados -->
        <div class="results-count">
            <i class="bi bi-info-circle"></i>
            Mostrando <strong id="countVisible" th:text="${eventos.size()}">0</strong> de <strong th:text="${eventos.size()}">0</strong> evento(s)
        </div>

        <!-- Tabla de Eventos -->
        <div class="table-responsive">
            <table class="data-table" id="tablaEventos">
                <thead>
                <tr>
                    <th>Evento</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                    <th>Cupos</th>
                    <th>Precio</th>
                    <th style="text-align: center;">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="evento : ${eventos}"
                    class="evento-row"
                    th:attr="data-estado=${evento.estado.name()}">

                    <td data-label="Evento">
                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <div style="width: 50px; height: 50px; border-radius: 8px; overflow: hidden; background-color: var(--color-bg-light); display: flex; align-items: center; justify-content: center; border: 2px solid var(--border-color);">
                                <img th:if="${evento.imagen_evento != null}"
                                     th:src="@{'/uploads/' + ${evento.imagen_evento}}"
                                     style="width: 100%; height: 100%; object-fit: cover;"
                                     alt="Evento">
                                <i th:unless="${evento.imagen_evento != null}"
                                   class="bi bi-image"
                                   style="font-size: 1.5rem; color: var(--color-primary);"></i>
                            </div>
                            <div>
                                <strong th:text="${evento.nombre}">Nombre</strong>
                                <br>
                                <small style="color: var(--color-text-light);" th:text="${evento.tipo_evento}">TIPO</small>
                            </div>
                        </div>
                    </td>

                    <td data-label="Fecha">
                        <span th:text="${#temporals.format(evento.fecha_evento, 'dd/MM/yyyy')}">Fecha</span>
                        <br>
                        <small style="color: var(--color-text-light);" th:text="${#temporals.format(evento.hora_evento, 'HH:mm')}">Hora</small>
                    </td>

                    <td data-label="Estado">
                        <span class="status-badge"
                              th:classappend="${evento.estado.name() == 'PUBLICADO'} ? 'approved' :
                                              (${evento.estado.name() == 'BORRADOR'} ? 'pending' :
                                              (${evento.estado.name() == 'FINALIZADO'} ? 'inactive' :
                                              (${evento.estado.name() == 'EN_CURSO'} ? 'active' : 'rejected')))"
                              th:text="${evento.estado.name()}">
                            ESTADO
                        </span>
                    </td>

                    <td data-label="Cupos">
                        <i class="bi bi-people"></i>
                        <span th:text="${evento.cuposOcupados}">0</span> /
                        <span th:text="${evento.cuposMaximosProveedor}">50</span>
                    </td>

                    <td data-label="Precio">
                        $<span th:text="${#numbers.formatDecimal(evento.costoEspacio, 0, 'COMMA', 0, 'POINT')}">0</span>
                    </td>

                    <td data-label="Acciones">
                        <div class="table-actions">
                            <a th:href="@{/eventos/ver/{id}(id=${evento.id_evento})}"
                               class="btn-action btn-view"
                               title="Ver Vista Previa">
                                <i class="bi bi-eye"></i>
                            </a>

                            <a th:href="@{/eventos/editar/{id}(id=${evento.id_evento})}"
                               class="btn-action btn-edit"
                               title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>

                            <a th:if="${evento.estado.name() == 'BORRADOR'}"
                               th:href="@{/eventos/aprobar/{id}(id=${evento.id_evento})}"
                               class="btn btn-success btn-sm"
                               title="Publicar"
                               onclick="return confirm('¿Publicar este evento?')">
                                <i class="bi bi-rocket-takeoff"></i>
                            </a>

                            <a th:href="@{/eventos/eliminar/{id}(id=${evento.id_evento})}"
                               class="btn-action btn-delete"
                               title="Eliminar"
                               onclick="return confirm('¿Eliminar este evento permanentemente?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
    <script>
        // Función para actualizar el contador de resultados visibles
        function actualizarContador() {
            const rows = document.querySelectorAll('.evento-row');
            let visibleCount = 0;

            rows.forEach(function(row) {
                if (row.style.display !== 'none') {
                    visibleCount++;
                }
            });

            const countVisible = document.getElementById('countVisible');
            if (countVisible) {
                countVisible.textContent = visibleCount;
            }
        }

        // Filtrar por estado
        window.filtrarTabla = function(estado, cardElement) {
            // Actualizar estilo activo
            document.querySelectorAll('.filter-card').forEach(function(card) {
                card.classList.remove('active');
            });
            cardElement.classList.add('active');

            // Filtrar filas
            const rows = document.querySelectorAll('.evento-row');
            rows.forEach(function(row) {
                const rowEstado = row.getAttribute('data-estado');
                if (estado === 'TODOS' || rowEstado === estado) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });

            actualizarContador();
        };

        // Buscar en la tabla
        window.buscarEnTabla = function() {
            const searchValue = document.getElementById('buscadorAdmin').value.toLowerCase();
            const rows = document.querySelectorAll('.evento-row');

            rows.forEach(function(row) {
                const text = row.textContent.toLowerCase();
                row.style.display = text.indexOf(searchValue) > -1 ? '' : 'none';
            });

            actualizarContador();
        };
    </script>
</main>

</body>
</html>
