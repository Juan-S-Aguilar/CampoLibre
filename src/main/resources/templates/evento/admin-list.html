<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout(~{::title}, ~{::content})}">
<head>
    <title>Gestión de Eventos - Campo Libre</title>
    <style>
        /* Puntos de estado */
        .status-dot {
            height: 10px;
            width: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
        .dot-publicado { background-color: #198754; }
        .dot-borrador { background-color: #ffc107; }
        .dot-finalizado { background-color: #6c757d; }
        .dot-cancelado { background-color: #dc3545; }
        .dot-en-curso { background-color: #0d6efd; }

        .table-hover tbody tr:hover {
            background-color: rgba(0,0,0,.02);
        }

        /* Estilos para tarjetas clicables (Filtros) */
        .filter-card {
            cursor: pointer !important; /* ⬅️ FORZAR con !important */
            transition: transform 0.2s, box-shadow 0.2s;
            user-select: none; /* ⬅️ EVITAR selección de texto */
        }

        .filter-card * {
            cursor: pointer !important; /* ⬅️ APLICAR a todos los hijos también */
        }

        .filter-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
            cursor: pointer !important; /* ⬅️ FORZAR en hover */
        }

        .filter-card.active {
            border: 2px solid #0d6efd !important;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>

<main th:fragment="content">
    <div class="container mt-4 mb-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="display-6"><i class="bi bi-gear-wide-connected"></i> Gestión de Eventos</h1>
                <p class="text-muted mb-0">Administra el ciclo de vida de tus eventos</p>
            </div>
            <a th:href="@{/eventos/crear}" class="btn btn-success"><i class="bi bi-plus-lg"></i> Nuevo Evento</a>
        </div>

        <div class="row mb-4 g-3">
            <div class="col-md-2 col-6">
                <div class="card bg-light border-0 shadow-sm h-100 filter-card active"
                     onclick="filtrarTabla('TODOS', this)">
                    <div class="card-body text-center p-3">
                        <div class="bg-primary text-white rounded-circle p-2 d-inline-block mb-2">
                            <i class="bi bi-grid-fill fs-5"></i>
                        </div>
                        <h4 class="mb-0 fw-bold" th:text="${eventos.size()}">0</h4>
                        <small class="text-muted">Todos</small>
                    </div>
                </div>
            </div>

            <div class="col-md-2 col-6">
                <div class="card bg-light border-0 shadow-sm h-100 filter-card"
                     onclick="filtrarTabla('PUBLICADO', this)">
                    <div class="card-body text-center p-3">
                        <div class="bg-success text-white rounded-circle p-2 d-inline-block mb-2">
                            <i class="bi bi-broadcast fs-5"></i>
                        </div>
                        <h4 class="mb-0 fw-bold" th:text="${#lists.size(eventos.?[estado == T(com.example.campolibre.Enum.EstadoEvento).PUBLICADO])}">0</h4>
                        <small class="text-muted">Publicados</small>
                    </div>
                </div>
            </div>

            <div class="col-md-2 col-6">
                <div class="card bg-light border-0 shadow-sm h-100 filter-card"
                     onclick="filtrarTabla('EN_CURSO', this)">
                    <div class="card-body text-center p-3">
                        <div class="bg-info text-white rounded-circle p-2 d-inline-block mb-2">
                            <i class="bi bi-play-circle-fill fs-5"></i>
                        </div>
                        <h4 class="mb-0 fw-bold" th:text="${#lists.size(eventos.?[estado == T(com.example.campolibre.Enum.EstadoEvento).EN_CURSO])}">0</h4>
                        <small class="text-muted">En Curso</small>
                    </div>
                </div>
            </div>

            <div class="col-md-2 col-6">
                <div class="card bg-light border-0 shadow-sm h-100 filter-card"
                     onclick="filtrarTabla('BORRADOR', this)">
                    <div class="card-body text-center p-3">
                        <div class="bg-warning text-dark rounded-circle p-2 d-inline-block mb-2">
                            <i class="bi bi-pencil-square fs-5"></i>
                        </div>
                        <h4 class="mb-0 fw-bold" th:text="${#lists.size(eventos.?[estado == T(com.example.campolibre.Enum.EstadoEvento).BORRADOR])}">0</h4>
                        <small class="text-muted">Borradores</small>
                    </div>
                </div>
            </div>

            <div class="col-md-2 col-6">
                <div class="card bg-light border-0 shadow-sm h-100 filter-card"
                     onclick="filtrarTabla('FINALIZADO', this)">
                    <div class="card-body text-center p-3">
                        <div class="bg-secondary text-white rounded-circle p-2 d-inline-block mb-2">
                            <i class="bi bi-flag-fill fs-5"></i>
                        </div>
                        <h4 class="mb-0 fw-bold" th:text="${#lists.size(eventos.?[estado == T(com.example.campolibre.Enum.EstadoEvento).FINALIZADO])}">0</h4>
                        <small class="text-muted">Finalizados</small>
                    </div>
                </div>
            </div>

            <div class="col-md-2 col-6">
                <div class="card bg-light border-0 shadow-sm h-100 filter-card"
                     onclick="filtrarTabla('CANCELADO', this)">
                    <div class="card-body text-center p-3">
                        <div class="bg-danger text-white rounded-circle p-2 d-inline-block mb-2">
                            <i class="bi bi-x-circle-fill fs-5"></i>
                        </div>
                        <h4 class="mb-0 fw-bold" th:text="${#lists.size(eventos.?[estado == T(com.example.campolibre.Enum.EstadoEvento).CANCELADO])}">0</h4>
                        <small class="text-muted">Cancelados</small>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <h5 class="mb-0 text-muted"><i class="bi bi-list-ul"></i> Inventario</h5>
                    </div>
                    <div class="col-md-6">
                        <input type="text" id="buscadorAdmin" class="form-control form-control-sm" placeholder="Buscar evento...">
                    </div>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0" id="tablaEventos">
                        <thead class="table-light">
                        <tr>
                            <th class="ps-4">Evento</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                            <th>Cupos</th>
                            <th>Precio</th>
                            <th class="text-end pe-4">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="evento : ${eventos}"
                            class="evento-row"
                            th:attr="data-estado=${evento.estado.name()}">

                            <td class="ps-4">
                                <div class="d-flex align-items-center">
                                    <div class="rounded bg-light d-flex align-items-center justify-content-center me-3"
                                         style="width: 40px; height: 40px; overflow: hidden;">
                                        <img th:if="${evento.imagen_evento != null}"
                                             th:src="@{'/uploads/' + ${evento.imagen_evento}}"
                                             class="img-fluid" style="object-fit: cover; height: 100%; width: 100%;">
                                        <i th:unless="${evento.imagen_evento != null}" class="bi bi-image text-muted"></i>
                                    </div>
                                    <div>
                                        <div class="fw-bold text-dark" th:text="${evento.nombre}">Nombre</div>
                                        <small class="text-muted" th:text="${evento.tipo_evento}">TIPO</small>
                                    </div>
                                </div>
                            </td>

                            <td>
                                <span th:text="${#temporals.format(evento.fecha_evento, 'dd MMM yyyy')}">Fecha</span>
                                <br>
                                <small class="text-muted" th:text="${#temporals.format(evento.hora_evento, 'HH:mm')}">Hora</small>
                            </td>

                            <td>
                                <div class="d-flex align-items-center">
                <span class="status-dot"
                      th:classappend="${evento.estado.name() == 'PUBLICADO' ? 'dot-publicado' :
                                      (evento.estado.name() == 'BORRADOR' ? 'dot-borrador' :
                                      (evento.estado.name() == 'FINALIZADO' ? 'dot-finalizado' :
                                      (evento.estado.name() == 'EN_CURSO' ? 'dot-en-curso' : 'dot-cancelado')))}">
                </span>
                                    <span th:text="${evento.estado.name()}">ESTADO</span>
                                </div>
                            </td>

                            <td>
            <span class="badge bg-light text-dark border">
                <i class="bi bi-person"></i>
                <span th:text="${evento.cuposOcupados}">0</span> / <span th:text="${evento.cuposMaximosProveedor}">50</span>
            </span>
                            </td>

                            <td>
                                $<span th:text="${#numbers.formatDecimal(evento.costoEspacio, 0, 'COMMA', 0, 'POINT')}">0</span>
                            </td>

                            <td class="text-end pe-4">
                                <div class="btn-group">
                                    <a th:href="@{/eventos/ver/{id}(id=${evento.id_evento})}"
                                       class="btn btn-sm btn-outline-secondary" title="Ver Vista Previa">
                                        <i class="bi bi-eye"></i>
                                    </a>

                                    <a th:href="@{/eventos/editar/{id}(id=${evento.id_evento})}"
                                       class="btn btn-sm btn-outline-primary" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>

                                    <a th:if="${evento.estado.name() == 'BORRADOR'}"
                                       th:href="@{/eventos/aprobar/{id}(id=${evento.id_evento})}"
                                       class="btn btn-sm btn-success" title="Publicar"
                                       onclick="return confirm('¿Publicar este evento?')">
                                        <i class="bi bi-rocket-takeoff"></i>
                                    </a>

                                    <a th:if="${evento.estado.name() == 'PUBLICADO' || evento.estado.name() == 'EN_CURSO'}"
                                       href="#" class="btn btn-sm btn-outline-dark" title="Finalizar Evento">
                                        <i class="bi bi-flag"></i>
                                    </a>

                                    <a th:href="@{/eventos/eliminar/{id}(id=${evento.id_evento})}"
                                       class="btn btn-sm btn-outline-danger" title="Eliminar"
                                       onclick="return confirm('¿Eliminar este evento permanentemente?')">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer bg-white text-center py-3">
                <small class="text-muted">Mostrando todos los eventos creados por ti.</small>
            </div>
        </div>

    </div>
    <script th:inline="javascript">
        /*<![CDATA[*/

        // Asegurar que el script se ejecute después de cargar el DOM
        (function() {
            'use strict';

            console.log('Script de filtros cargado'); // DEBUG

            // Exponer función globalmente
            window.filtrarTabla = function(estado, cardElement) {
                console.log('🎯 Filtrando por estado:', estado);

                // 1. Actualizar estilo activo
                document.querySelectorAll('.filter-card').forEach(function(card) {
                    card.classList.remove('active');
                });
                cardElement.classList.add('active');

                // 2. Filtrar filas
                var rows = document.querySelectorAll('.evento-row');
                console.log('📋 Total de filas:', rows.length);

                rows.forEach(function(row) {
                    var rowEstado = row.getAttribute('data-estado');
                    console.log('  → Estado de fila:', rowEstado);

                    if (estado === 'TODOS' || rowEstado === estado) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                });
            };

            // Buscador de texto
            document.addEventListener('DOMContentLoaded', function() {
                var buscador = document.getElementById('buscadorAdmin');
                if (buscador) {
                    buscador.addEventListener('keyup', function() {
                        var value = this.value.toLowerCase();
                        var rows = document.querySelectorAll('.evento-row');

                        rows.forEach(function(row) {
                            var text = row.textContent.toLowerCase();
                            row.style.display = text.indexOf(value) > -1 ? '' : 'none';
                        });
                    });
                }
            });

            console.log('✅ Función filtrarTabla disponible:', typeof window.filtrarTabla);
        })();

        /*]]>*/
    </script>
</main>



</body>
</html>
